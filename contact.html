<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-form">
            <h2>Get In Touch</h2>

            <form action="#" method="post">
                <!-- Text input with minlength validation -->
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" minlength="2" required>
                </div>

                <!-- Email input with built-in browser validation -->
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Dropdown select input -->
                <div class="form-group">
                    <label for="reason">Reason for contact:</label>
                    <select id="reason" name="reason" required>
                        <option value="">-- Please choose --</option>
                        <option value="job">Job Opportunity</option>
                        <option value="freelance">Freelance Project</option>
                        <option value="general">General Enquiry</option>
                    </select>
                </div>

                <!-- Radio button group -->
                <fieldset class="form-group">
                    <legend>Preferred contact method:</legend>
                    <input type="radio" id="contact-email" name="contact-method" value="email" checked>
                    <label for="contact-email">Email</label>

                    <input type="radio" id="contact-phone" name="contact-method" value="phone">
                    <label for="contact-phone">Phone</label>
                </fieldset>

                <!-- Textarea with minlength validation -->
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" minlength="10" required></textarea>
                </div>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Contact me at email@example.com</p>
    </footer>
</body>
</html>
